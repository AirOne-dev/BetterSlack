<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The social card. Rendered at 1200x630 and saved to site/cover.webp:
       chrome --headless=new --window-size=1200,630 --allow-file-access-from-files \
         --screenshot=/tmp/cover.png file://$PWD/scripts/cover.html
       cwebp -q 88 /tmp/cover.png -o site/cover.webp
     Assets are addressed relative to this file. Everything else in the project
     is WebP straight out of Chromium's own encoder; this one goes through
     cwebp because Chrome's --screenshot only writes PNG, and it is a card
     regenerated by hand a few times a year rather than part of any pipeline.

     Note for whoever redoes it: an og:image is read by scrapers rather than by
     a browser you control. WebP is fine for X, Facebook and Slack unfurls
     today; if a preview ever comes back blank somewhere, this is the one file
     in the project worth putting back to JPEG. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #08080c;
    color: #ececf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center;
    position: relative;
  }
  .glow {
    position: absolute; inset: -30% -10% auto -20%; height: 700px;
    background:
      radial-gradient(45% 60% at 20% 35%, rgba(97, 31, 105, .75), transparent 70%),
      radial-gradient(38% 55% at 62% 12%, rgba(54, 197, 240, .22), transparent 70%),
      radial-gradient(42% 60% at 88% 60%, rgba(224, 30, 90, .28), transparent 72%);
    filter: blur(14px);
  }
  .text { position: relative; padding: 0 0 0 64px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand img { width: 34px; height: 34px; }
  .brand span { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  h1 { font-size: 56px; line-height: 1.06; letter-spacing: -.03em; font-weight: 800; }
  h1 .dim { color: #8b8b9c; }
  p { margin-top: 20px; font-size: 21px; line-height: 1.45; color: #a8a8b8; max-width: 22ch; }
  .pills { display: flex; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
  .pill {
    font-size: 14px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); color: #d3d3de;
    background: rgba(255,255,255,.05);
  }
  .shot {
    position: absolute; right: -110px; top: 50%; transform: translateY(-50%) rotate(-4deg);
    width: 720px; border-radius: 18px; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 90px rgba(0,0,0,.65);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="shot" src="../site/shots/mods/aurora.webp" alt="">
  <div class="text">
    <div class="brand">
      <img src="../site/mark.svg" alt="">
      <span>BetterSlack</span>
    </div>
    <h1><span class="dim">You know BetterDiscord.</span><br>Now Slack has one.</h1>
    <p>Themes, plugins and a ⌘K palette — without patching Slack.app.</p>
    <div class="pills">
      <span class="pill">23 mods</span>
      <span class="pill">Theme builder</span>
      <span class="pill">MIT</span>
    </div>
  </div>
</body>
</html>
