name: Site

# The presentation site, published from site/ to GitHub Pages.
#
# The catalogue it lists is generated from mods/registry.json, so the job
# regenerates it and fails if what is committed has drifted — a site listing
# mods the repository no longer has is worse than no site.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'mods/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: site/data.js is up to date
        run: |
          node scripts/build-site.mjs
          if ! git diff --quiet -- site/data.js; then
            echo "::error::site/data.js is stale. Run 'pnpm site' and commit the result."
            git --no-pager diff -- site/data.js
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
