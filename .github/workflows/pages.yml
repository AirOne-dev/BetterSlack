name: Site

# The presentation site, published from site/ to GitHub Pages.
#
# The catalogue it lists is generated from mods/registry.json, so the job
# regenerates it and fails if what is committed has drifted — a site listing
# mods the repository no longer has is worse than no site.

on:
  push:
    branches: [master]
    # The API page is generated from docs/api/, from the preview renderers and
    # from the TypeScript the build cross-checks them against, so a change to
    # any of those makes the committed page stale. Leaving them off this list
    # meant the drift check below simply did not run for an API change, which is
    # the one change it exists to catch.
    paths:
      - 'site/**'
      - 'mods/**'
      - 'docs/api/**'
      - 'docs/guide/**'
      - 'src/**'
      - 'tests/slack-fixture.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/build-api-page.mjs'
      - 'scripts/api-doc.mjs'
      - 'scripts/api-previews.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: each doc page shows when it last changed, and
          # `git log` per file on a one-commit checkout comes back empty.
          fetch-depth: 0
      # The dependencies are needed here like in every other job: bundling
      # site/api-previews.js is esbuild. pnpm before setup-node, so the cache
      # key can be the lockfile.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: the generated site files are up to date
        run: |
          node scripts/build-site.mjs
          # api.html and api-previews.js are generated from the TypeScript and
          # from the mods, so they go stale the moment the API changes -- which
          # is the whole reason the page is generated rather than written.
          if ! git diff --quiet -- site/data.js site/api.html site/api-previews.js site/api-themes.css site/api-fixtures.js docs/api.md; then
            echo "::error::a generated site file is stale. Run 'pnpm site' and commit the result."
            git --no-pager diff --stat -- site/data.js site/api.html site/api-previews.js site/api-themes.css site/api-fixtures.js docs/api.md
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
